   a.vx-=dx*f;a.vy-=dy*f;b.vx+=dx*f;b.vy+=dy*f}}
 for(const n of N){n.x+=n.vx*=0.82;n.y+=n.vy*=0.82}}
let z=0.62,ox=innerWidth/2,oy=innerHeight/2,drag=0,px,py;
function draw(){x.fillStyle='#0d1117';x.fillRect(0,0,c.width,c.height);
 x.save();x.translate(ox,oy);x.scale(z,z);
 x.strokeStyle='rgba(139,148,158,.16)';x.lineWidth=.6;x.beginPath();
 for(const e of E){const a=N[idx.get(e.source)],b=N[idx.get(e.target)];
  if(a&&b){x.moveTo(a.x,a.y);x.lineTo(b.x,b.y)}}x.stroke();
 for(const n of N){const r=Math.min(3+Math.sqrt(n.degree)*.85,15);
  x.fillStyle=P[(n.community??0)%P.length];x.beginPath();
  x.arc(n.x,n.y,r,0,7);x.fill();
  if(n.degree>34){x.fillStyle='#e6edf3';x.font='10px monospace';
   x.fillText(n.label.slice(0,26),n.x+r+2,n.y+3)}}
 x.restore()}
draw();
c.onmousedown=e=>{drag=1;px=e.clientX;py=e.clientY;c.style.cursor='grabbing'};
onmouseup=()=>{drag=0;c.style.cursor='grab'};
c.onmousemove=e=>{
 if(drag){ox+=e.clientX-px;oy+=e.clientY-py;px=e.clientX;py=e.clientY;draw();return}
 const mx=(e.clientX-ox)/z,my=(e.clientY-oy-42)/z;let h=null;
 for(const n of N){const r=Math.min(3+Math.sqrt(n.degree)*.85,15)+3;
  if(Math.hypot(n.x-mx,n.y-my)<r){h=n;break}}
 if(h){t.style.display='block';t.style.left=(e.clientX+12)+'px';
  t.style.top=(e.clientY+12)+'px';
  t.innerHTML='<b>'+h.label+'</b><br>'+h.kind+' · degree '+h.degree+
   '<br><span style=color:#8b949e>'+h.file+'</span>'}
 else t.style.display='none'};
c.onwheel=e=>{e.preventDefault();const k=e.deltaY<0?1.12:.89;
 ox=e.clientX-(e.clientX-ox)*k;oy=e.clientY-(e.clientY-oy)*k;z*=k;draw()};
</script>
