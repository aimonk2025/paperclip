const PAL=['#4E79A7','#F28E2B','#E15759','#76B7B2','#59A14F','#EDC948','#B07AA1','#FF9DA7','#9C755F','#BAB0AC'];
const LC={};D.layers.forEach(l=>LC[l.name]=l.color);
let mode='layer', hidden=new Set();

function color(n){return mode==='layer'?(LC[n.layer]||'#888'):PAL[(n.community>=0?n.community:0)%PAL.length]}
function key(n){return mode==='layer'?n.layer:String(n.community)}

const nodes=new vis.DataSet(D.nodes.map(n=>({
  id:n.id,label:n.degree>25?n.label:'',title:n.label+'  ['+n.layer+']',
  value:Math.max(n.degree,1),color:{background:color(n),border:color(n)},
  font:{color:'#e6edf3',size:11}})));
const edges=new vis.DataSet(D.edges.map((e,i)=>({id:i,
  from:D.nodes[e[0]].id,to:D.nodes[e[1]].id,
  color:{color:'rgba(139,148,158,.13)'},width:.5})));
const net=new vis.Network(document.getElementById('net'),{nodes,edges},{
 nodes:{shape:'dot',scaling:{min:4,max:34}},
 edges:{smooth:false,arrows:{to:{enabled:true,scaleFactor:.28}}},
 physics:{stabilization:{iterations:190},barnesHut:{gravitationalConstant:-9000,
  springLength:110,springConstant:.03,damping:.5}},
 interaction:{hover:true,tooltipDelay:140}});

function repaint(){
 nodes.update(D.nodes.map(n=>({id:n.id,
  hidden:hidden.has(key(n)),
  color:{background:color(n),border:color(n)}})));
}

function esc(s){return String(s||'').replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}

function panel(){
 const p=document.getElementById('panel');

 if(mode==='fam'){
  const inv=D.inventory||{};const fams=inv.families||[];
  if(!fams.length){p.innerHTML='<h3>Families</h3><div class=note>No INVENTORY.json — run ransack.py first.</div>';return}
  const eps=inv.entrypoints||{};
  p.innerHTML='<h3>Families — the count to match</h3>'+
   '<div class=note>Communities show where code is dense. This counts the things. '+
   'If they ship 12 adapters and you build 5, that is an unfinished port.</div>'+
   fams.slice(0,16).map(f=>'<div class=card data-mem="'+esc((f.members||[]).join(','))+'">'+
    '<div class=ct><b>'+esc(f.path)+'</b><span class=badge>'+f.kind+'</span>'+
    '<span class=big>'+f.count+'</span></div>'+
    '<div class=mem>'+(f.members||[]).slice(0,14).map(m=>'<code>'+esc(m)+'</code>').join(' ')+
    ((f.members||[]).length>14?' <span style=color:#666>+'+((f.members||[]).length-14)+'</span>':'')+
    '</div></div>').join('')+
   (Object.keys(eps).length?'<h3 style=margin-top:14px>Entrypoints — what runs</h3>'+
    Object.entries(eps).sort((a,b)=>b[1].length-a[1].length).map(([k,v])=>
    '<div class=row><div class=lbl>'+esc(k)+'</div><div class=cnt>'+v.length+'</div></div>').join(''):'')+
   ((inv.variants||[]).length?'<h3 style=margin-top:14px>Variants — cases handled</h3>'+
    inv.variants.slice(0,10).map(v=>'<div class=row title="'+esc((v.arms||[]).join(', '))+'">'+
    '<div class=lbl><code>'+esc(v.name)+'</code></div><div class=cnt>'+v.count+' arms</div></div>').join(''):'');
  p.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
   const mem=(c.dataset.mem||'').split(',').filter(Boolean);
   const hit=D.nodes.filter(n=>mem.some(m=>(n.file||'').includes('/'+m+'/')||(n.file||'').includes('/'+m+'.')));
   if(hit.length){net.selectNodes(hit.map(h=>h.id));net.fit({nodes:hit.slice(0,60).map(h=>h.id),animation:true})}});
  return}

 if(mode==='cap'){
  const cs=D.census||[];
  if(!cs.length){p.innerHTML='<h3>Capabilities</h3><div class=note>No census — run ransack.py first.</div>';return}
  p.innerHTML='<h3>What each module DOES</h3>'+
   '<div class=note>Enumerated before deciding anything. You cannot subtract a concept you never saw.</div>'+
   cs.map(c=>'<div class=card><div class=ct><b>'+esc(c.module)+'</b>'+
    (c.files?'<span class=badge>'+c.files+' files · '+c.lines+' lines</span>':'')+'</div>'+
    (c.behaviours||[]).map(b=>'<div class=bar><span>'+esc(b.name)+'</span>'+
      '<i style=width:'+Math.min(b.count*7,100)+'px></i><em>'+b.count+'</em></div>').join('')+
    ((c.surface||[]).length?'<div class=sf>'+c.surface.slice(0,5).map(s=>
      '<div title="'+esc(s.exports)+'"><code>'+esc(s.file)+'</code> <span>'+s.lines+'L</span></div>').join('')+'</div>':'')+
    '</div>').join('');
  return}

 if(mode==='tour'){
  const t=D.tour||[];
  p.innerHTML='<h3>Guided tour — dependency order</h3>'+
   '<div class=note>Read in this order, not alphabetically. Entrypoints first, then by how many things depend on it.</div>'+
   t.map((s,i)=>'<div class="card tourstep" data-id="'+esc(s.id)+'">'+
    '<div class=ct><span class=num>'+(i+1)+'</span><b>'+esc(s.label)+'</b>'+
    '<span class=badge style=background:'+(LC[s.layer]||'#888')+'22+;color:'+(LC[s.layer]||'#888')+'>'+s.layer+'</span></div>'+
    '<div class=f>'+esc(s.file)+'</div><div class=why>'+esc(s.why)+'</div></div>').join('');
  p.querySelectorAll('.tourstep').forEach(d=>d.onclick=()=>{
   sel(d.dataset.id);net.focus(d.dataset.id,{scale:1.2,animation:true})});
  return}

 const items = mode==='layer'
  ? D.layers.map(l=>({k:l.name,label:l.name,count:l.count,c:l.color}))
  : D.communities.map(c=>({k:String(c.index),
      label:c.name,count:c.size,c:PAL[c.index%PAL.length],
      sub:c.depth+' · cond '+c.conductance+(c.stability!=null?' · stab '+c.stability:'')}));
 p.innerHTML='<h3>'+(mode==='layer'?'Architectural layer':'Modules (~'+D.communities.length+')')+
  '</h3>'+items.map(i=>'<div class="row'+(hidden.has(i.k)?' off':'')+'" data-k="'+i.k+'">'+
  '<div class=dot style=background:'+i.c+'></div><div class=lbl title="'+
  esc(i.sub||i.label)+'">'+esc(i.label)+'</div><div class=cnt>'+i.count+'</div></div>').join('');
 p.querySelectorAll('.row').forEach(r=>r.onclick=()=>{
  const k=r.dataset.k; hidden.has(k)?hidden.delete(k):hidden.add(k);
  r.classList.toggle('off'); repaint()});
}
panel();
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
 t.classList.add('on'); mode=t.dataset.t; hidden.clear(); panel();
 if(mode==='layer'||mode==='comm')repaint()});

const S=document.getElementById('search'),R=document.getElementById('sr');
S.oninput=()=>{const q=S.value.toLowerCase().trim();
 if(q.length<2){R.style.display='none';return}
 const hits=D.nodes.filter(n=>n.label.toLowerCase().includes(q)||
  (n.file||'').toLowerCase().includes(q)).slice(0,26);
 R.innerHTML=hits.map(n=>'<div class=si data-id="'+n.id+'">'+n.label+
  ' <span>'+n.layer+' · '+(n.file||'').split('/').slice(-2).join('/')+'</span></div>').join('');
 R.style.display=hits.length?'block':'none';
 R.querySelectorAll('.si').forEach(d=>d.onclick=()=>{sel(d.dataset.id);
  net.focus(d.dataset.id,{scale:1.15,animation:true});R.style.display='none'})};

function sel(id){
 const n=byId.get(id); if(!n)return;
 const nb=net.getConnectedNodes(id).map(i=>byId.get(i)).filter(Boolean)
   .sort((a,b)=>b.degree-a.degree).slice(0,14);
 const I=document.getElementById('insp');
 I.style.display='block';
 I.innerHTML='<b>'+n.label+'</b><div class=f>'+(n.file||'')+'</div>'+
  '<div><span class=k>kind</span>'+n.kind+'</div>'+
  '<div><span class=k>layer</span><span style=color:'+(LC[n.layer]||'#888')+'>'+n.layer+'</span></div>'+
  '<div><span class=k>degree</span>'+n.degree+'</div>'+
  '<div><span class=k>community</span>'+n.community_name+'</div>'+
  (nb.length?'<h3 style=margin-top:10px>Connected ('+nb.length+')</h3><ul>'+
   nb.map(x=>'<li data-id="'+x.id+'">'+x.label+' <span style=color:#666>'+x.layer+'</span></li>').join('')+'</ul>':'');
 I.querySelectorAll('li').forEach(li=>li.onclick=()=>{sel(li.dataset.id);
  net.focus(li.dataset.id,{scale:1.15,animation:true})});
}
net.on('click',p=>{if(p.nodes.length)sel(p.nodes[0]);
 else document.getElementById('insp').style.display='none'});
</script></body></html>
